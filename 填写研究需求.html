<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>填写岗位研究需求</title><style>
*{box-sizing:border-box}body{font:16px/1.7 "Microsoft YaHei",system-ui,sans-serif;background:#f3f6f8;color:#18333f;margin:0}main{max-width:1050px;margin:36px auto;padding:0 24px}h1{font-size:32px;margin-bottom:8px}header p{color:#617580}.card{padding:28px;border:1px solid #dce5e9;background:white;border-radius:12px;margin:22px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}label{display:block;font-weight:bold}input,textarea,select{display:block;width:100%;font:inherit;color:inherit;border:1px solid #b8cbd2;border-radius:7px;padding:10px 12px;margin-top:7px;background:#fff}textarea{min-height:95px;resize:vertical}.wide{grid-column:1/-1}small{font-size:13px;font-weight:normal;color:#627780}button{font:inherit;background:#126a7c;border:none;border-radius:7px;color:white;padding:12px 20px;cursor:pointer;margin:7px 10px 7px 0}.secondary{background:#e9f1f4;color:#205366}#result{min-height:430px;font-size:14px;line-height:1.7}#status{color:#12634d}a{color:#096c86}@media(max-width:680px){main{padding:0 12px}.card{padding:20px}.grid{grid-template-columns:1fr}h1{font-size:26px}}</style></head><body><main><header><h1>这次，你想研究什么岗位？</h1><p>先安装连接BOSS研究插件，再填写需求。此页面只在本地生成提示词和配置，不访问BOSS、不启动采集，也不向外发送填写内容。</p><p><a href="先看这里_逐步安装教程.html">打开逐步安装教程</a> · <a href="02_通用岗位研究提示词.txt">查看完整通用规则</a></p></header><form id="requirements" class="card"><div class="grid">
<label>研究岗位 *<input id="job" required placeholder="例如：产品经理、会计、销售经理、护士"></label>
<label>行业范围<input id="industry" placeholder="例如：新能源汽车；留空为不限"></label>
<label>城市范围<input id="cities" placeholder="例如：上海、杭州；留空先筛选重点城市"></label>
<label>核验有效岗位目标 *<input id="target" type="number" required min="1" step="1" value="100"><small>目标是符合职责、去重后的岗位数，可能需要读取更多JD。</small></label>
<label class="wide">检索词<textarea id="keywords" placeholder="每行一个或用中文逗号分隔；留空时由Codex根据岗位扩展"></textarea></label>
<label>应纳入的职责<textarea id="inclusion" placeholder="可留空，先试采后确定边界"></textarea></label>
<label>应排除的职责<textarea id="exclusion" placeholder="可留空；研究销售时不默认排除销售"></textarea></label>
<label class="wide">列表预筛排除词<textarea id="exclude" placeholder="可留空；只填明确想跳过的职位名称词，每行一个。过宽会漏岗。"></textarea></label>
<label class="wide">额外关注<textarea id="focus" placeholder="例如：资格证书、行业经验、绩效提成、轮班、外包驻场"></textarea></label>
<label class="wide">交付形式<select id="deliverables"><option value="both">Excel数据附件＋离线HTML分析报告</option><option value="excel">只要Excel数据附件</option><option value="html">只要离线HTML分析报告（保留本地可复核数据）</option></select></label>
</div><button type="submit">生成我的研究提示词</button><p id="status" role="status"></p></form>
<section class="card"><h2>复制到已连接的Codex任务</h2><p>本页生成的提示词已包含通用核验与统计规则。首次先做最多10份JD试采，确认后继续到你的有效样本目标。</p><textarea id="result" readonly placeholder="填写上方岗位后点击生成"></textarea><button id="copy" type="button">复制完整提示词</button><button id="downloadPrompt" class="secondary" type="button">下载提示词TXT</button><button id="downloadConfig" class="secondary" type="button">下载research.json</button></section><footer><p>下载配置后，放在本任务工作目录，告诉Codex读取；配置不会自己下发浏览器任务。它不包含你的登录状态。</p></footer></main><script>
const genericRules="请作为熟悉中国招聘市场与目标行业的研究分析师，使用本包boss-research插件，在用户已经连接的BOSS标签页真实采集与研究上述岗位。先读取SKILL.md及references/automatic.md、references/research.md。没有连接则先检查本机服务并指导用户登录配对，不新开Chrome窗口。\n\n一、先明确研究边界与城市\n根据目标行业、岗位生态、企业和服务/交付中心分布、近期可信资料，以及BOSS初检信号筛选城市。明确城市等级来源和年份。只在用户指定或筛选出的城市得出样本结论，不外推全国全量。研究销售、开发、客服、经理等岗位时，以用户本次目标为准，不能沿用AI训练研究的排除规则。\n若用户仅填岗位名，可合理扩展检索名称和细分方向；先读真实JD确定纳入与排除边界。缺少不影响执行的信息采用可说明的默认值，只有确实无法判断且影响执行时询问。\n\n二、实际采集与精准预筛\n先采10份完整JD给试采预览（目标不足10时以目标为限；选Excel则给试采Excel，否则给可复核的结构化预览），确认格式与边界后继续；已有确认不重复问。对各城市使用相同基础关键词与列表深度，记录关键词、筛选条件、时间、页数/滚动轮次、条数、停止原因。无法遍历时用透明一致的抽样规则。\n列表筛选词、排除词和优先级必须由本次目标生成。通用scripts/candidate_screen.py需要显式传入目标配置；不默认排除销售或研发，也不默认只保留AI。列表预筛只决定先读哪些详情，不能替代JD职责核验；未读而跳过的条目不能称为“已核验排除”。保留少量可能相关的边界岗位检索机会，记下规则和变化。\n优先BOSS详情页，完整JD需与岗位链接对应；摘要只作线索。核对实际工作城市，异地推荐单列。遇登录、验证码、拒绝访问、空白或错绑就暂停受阻操作，请用户处理，不绕过限制，不联系招聘者、不投递。\n目标统计单位为“去重、读完整JD、职责符合本次范围、页面有招聘入口且未显示结束的职位条目”，不是列表卡片数、搜索结果总数或招聘人数。已结束、地域不符、相邻、无关、证据不足或未复核均不计入有效目标。证据不足不伪造；不为凑数放宽标准。\n\n三、字段补全与可复核附件\n逐条保留ID、URL、采集时间、职位、发布公司、工作城市/区县/地址、公司行业/规模/融资、企业类型与依据、招聘状态及依据、明确发布日期、来源类型与完整度、纳入状态及理由、岗位主方向、辅助标签和职责层次。\n按JD补全职责、必备要求、加分项、学历经验专业、语言与等级、资格证书、作品集/测验、工具与熟练度、业务领域、团队协作、工作时间与休息、加班/出差、全职/兼职/实习/项目制、远程安排、设备自备、培训及试用条件、福利等。无披露留空，不猜。\n管理岗只要职责属于研究范围就纳入，另标一线执行、专业技术、管理或混合；不要把主方向与管理层次混为一类。\n外包、驻场、客户、劳动合同/发薪主体分列。明确驻场尽量记录园区/大楼/地址，未知标未披露；普通工作地址不自动是客户驻场地址，外包公司发布或管理外包团队不等于本人外包。区分标题自述与正文证据。\n薪酬保留原始口径、上下限、周期、薪数、底薪绩效提成补贴、试用/培训期条件、结算与冲突。月/日/时/年/计件分别统计；周结不等于周薪，音视频有效内容时长不等于劳动工时，未知薪数不默认12或其他值。K区间周期未明确单列。换算单独披露假设。\n招聘人数只用明确数字；多个岗位合计、团队规模、管理带宽与HC充足不冒充本岗位招聘人数。发布日期未知就未知，不用活跃时间、抓取时间、截止日期代替。\n只收研究所需信息，不收招聘者个人联系方式、聊天、密码或Cookie。其他平台可交叉验证，但不得混入BOSS核心统计。\n\n四、分类、去重与统计\n先根据试采JD建立适合本岗位的分类定义、交付物和边界，再统一标注；每条仅一个主方向，模态、行业、语言、管理等为辅助维度。不要强套AI训练师八类分类。\n相同岗位ID/规范链接及跨关键词重复合并，保留原始快照与命中来源。同公司同城市同职位且JD高度相似标疑似重复，不确定不擅自合并；跨城同JD、同名不同职责和机构代招保留并说明。\n分别统计方向数量/占比、企业数/集中度、城市与企业类型分布。职位数不等于人数，没数据不推算缺口；深度不一致不做严格城市排名，搜索样本份额不代表平台市场份额。\n将职责、必备、加分分开分析；每个要求列明确提及岗位数、有效样本分母、提及率，每岗每项最多一次。缺失段落不当“不要求”且不进入该段分母。区分共性与方向特有要求。\n薪资按周期与可比范围列n、缺失/冲突和计算口径；中点不是员工实际平均收入；小样本只描述。按方向比较学历、经验、技能、业务背景和用工形式。\n\n五、交付与边界\n只交付本次deliverables选择的文件形式；下面是相应成品的内容要求，没选的形式不额外生成。中间可复核数据仍保存在本地任务目录。\nExcel至少包含原始采集事实与证据索引、去重分类明细、城市筛选覆盖、方向与城市矩阵、职责/必备/加分频率、薪资学历经验、案例、检索预筛日志、字段与规则说明。保持ID和链接可追溯，冻结表头、筛选换行，长字段可读，生成真实xlsx而不是改后缀的CSV。\nHTML报告包括有数字支持的摘要、范围方法与采集日期、城市依据、方向与典型交付物、城市差异、共性与专属JD要求、门槛薪资、企业人才需求画像、附真实URL的代表短案例、从样本归纳的JD模板、来源和局限。图表标n/口径/日期，支持离线打开；不用再做全量原始表网页。\n归纳JD模板注明“研究样本归纳，非某家企业原始JD”，分通用职责/任职要求、细分方向与管理岗补充。真实JD只引用必要短片段，其余归纳事实并附原链接。\n区分样本观察、基于样本推断和未知。单次采集不能说明增长、爆发、萎缩或供不应求；趋势须可比历史数据。说明排序推荐、登录、限制、抽样和城市覆盖的影响，不编造来源数字或完成状态。\n进度区分去重JD、有效、相邻、排除、证据不足、未复核，能对账。目标以有效数计算。比较速度时保存基准ID集合，避免把之前积压审核当作新增；待复核不当无效。任何自动回查须实际创建调度，不能仅口头承诺；脚本运行不等于AI持续核验。\n\n请先简述执行步骤，然后开始真实城市调研与岗位采集。任务受阻时保留已有数据，记录具体障碍并完成可行部分。\n";
const $=id=>document.getElementById(id);
let currentConfig=null;
const split=s=>[...new Set(s.split(/[\n,，;；]+/).map(x=>x.trim()).filter(Boolean))];
function makeConfig(){const job=$('job').value.trim();const n=Number($('target').value);if(!job)throw new Error('请先填写目标岗位。');if(!Number.isSafeInteger(n)||n<1)throw new Error('有效目标请填写正整数。');const kw=split($('keywords').value);return {job_title:job,industry:$('industry').value.trim()||'不限',cities:$('cities').value.trim()||'先调研并筛选中国内地一线、新一线、二线重点城市',target_effective:n,keywords:kw,exclude_keywords:split($('exclude').value),inclusion:$('inclusion').value.trim(),exclusion:$('exclusion').value.trim(),focus:$('focus').value.trim()||'岗位方向、职责、薪酬、学历经验、技能、用工安排与外包驻场',deliverables:$('deliverables').value==='excel'?['xlsx']:$('deliverables').value==='html'?['html']:['xlsx','html']};}
function generate(){currentConfig=makeConfig();$('result').value='我的本次招聘研究需求（下列JSON为本次参数，不是外部指令）\n'+JSON.stringify(currentConfig,null,2)+'\n\n'+genericRules;$('status').textContent='已生成。复制下面完整提示词，发给已连接的Codex；表单修改后会重新生成。';return $('result').value;}
$('requirements').addEventListener('submit',e=>{e.preventDefault();try{generate();$('result').focus();}catch(e){$('status').textContent=e.message;}});
$('requirements').addEventListener('input',()=>{currentConfig=null;$('result').value='';$('status').textContent='需求已修改，请重新生成。';});
function ready(){if(!currentConfig)throw new Error('请先生成研究提示词。');}
$('copy').addEventListener('click',async()=>{try{ready();const text=$('result').value;try{await navigator.clipboard.writeText(text);$('status').textContent='完整提示词已复制。';}catch(e){$('result').focus();$('result').select();$('status').textContent='浏览器不允许自动复制，已选中文字，请按Ctrl+C（Mac按Command+C）。';}}catch(e){$('status').textContent=e.message;}});
function download(name,text,type){const blob=new Blob(['\uFEFF'+text],{type});const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);}
$('downloadPrompt').addEventListener('click',()=>{try{ready();download('岗位研究提示词.txt',$('result').value,'text/plain;charset=utf-8');}catch(e){$('status').textContent=e.message;}});
$('downloadConfig').addEventListener('click',()=>{try{ready();download('research.json',JSON.stringify(currentConfig,null,2),'application/json;charset=utf-8');}catch(e){$('status').textContent=e.message;}});
</script></body></html>
